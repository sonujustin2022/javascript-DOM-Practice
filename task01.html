<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Tak 01</title>
</head>
<body>
    <!-- qstn01 -->
    <p class="para">Hello World</p>
    <button onclick="changeText()">click to change text</button>

    <!-- -->
    
</body>
<script>
    const changeText = ()=>{
        document.getElementsByClassName('para')[0].innerText = "Welcome to DOM!"
    }
</script>
