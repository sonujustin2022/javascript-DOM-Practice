<!-- 1.	Change Text Content
	•	Create a paragraph with text “Hello World”.
	•	Add a button — when clicked, it changes the text to “Welcome to DOM!
// 	2.	Change Background Color
// 	•	Add a button that changes the page background color to yellow when clicked.
// 	3.	Input and Output
// 	•	Create an input box and a button.
// 	•	When the button is clicked, display the input text below it.
// 	4.	Hide and Show
// 	•	Create a paragraph and two buttons — one hides the paragraph and the other shows it.
// 	5.	Change Image
// 	•	Display an image.
// 	•	Add two buttons: one changes it to another image, and the second brings the first one back. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Tak 01</title>
  </head>
  <body>
    <!-- qstn01 -->
    <p class="para">Hello World</p>
    <button onclick="changeText()">click to change text</button>
    <br />
    <hr />

    <!--qstn02 -->
    <button onclick="yellowColor()">change Background Color</button>
    <br>
    <hr>

    <!-- qstn03 -->
     <input type="text"  id="inp">
     <button onclick="getData()">get Data</button>
     <h3></h3>
     <br>
     <hr>

     <!-- qstn04 -->
      <p class="para">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Laboriosam eos dicta architecto consequuntur nostrum culpa incidunt quod sequi, voluptate sit quidem voluptatum blanditiis quo error nam, quasi minus libero aliquam!</p>
      <button onclick="hide()">Hide</button>
      <button onclick="show()">Show</button>
      <br>
      <hr>

      <!--qstn05  -->
      <img class="imgs" style="height: 300px;" src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Gallet_clamshell_600x600_2.jpg" alt="">
      <br>
      <button onclick="next()">Next</button>
      <button onclick="back()">Back</button>

  </body>
  <script>
    const changeText = () => {
      document.getElementsByClassName("para")[0].innerText = "Welcome to DOM!";
    };

    const yellowColor = () => {
      document.getElementsByTagName("body")[0].style.backgroundColor = "yellow";
    };

    const getData = () =>{
       let value =  document.getElementById('inp').value;
       document.getElementsByTagName('h3')[0].innerText = value;
    };
    const hide = ()=>{
        document.getElementsByClassName('para')[1].style.display = "none";
    };
     const show = ()=>{
        document.getElementsByClassName('para')[1].style.display = "block";
    };
    const next = () =>{
        document.getElementsByClassName('imgs')[0].src = "https://www.licious.in/blog/wp-content/uploads/2022/04/shutterstock_1617156526-min-600x600.jpg"
    };
    const back = () =>{
        document.getElementsByClassName('imgs')[0].src = "https://upload.wikimedia.org/wikipedia/commons/4/4f/Gallet_clamshell_600x600_2.jpg"
    };


  </script>
</html>
