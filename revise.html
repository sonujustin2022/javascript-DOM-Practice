<!-- 1.	Change Text Content
	•	Create a paragraph with text “Hello World”.
	•	Add a button — when clicked, it changes the text to “Welcome to DOM!
// 	2.	Change Background Color
// 	•	Add a button that changes the page background color to yellow when clicked.
// 	3.	Input and Output
// 	•	Create an input box and a button.
// 	•	When the button is clicked, display the input text below it.
// 	4.	Hide and Show
// 	•	Create a paragraph and two buttons — one hides the paragraph and the other shows it.
// 	5.	Change Image
// 	•	Display an image.
// 	•	Add two buttons: one changes it to another image, and the second brings the first one back. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- qstn01 -->
    <h1>hello world</h1>
    <button onclick="changeText()">click me</button>
    <br />
    <br />
    <!-- qstn02 -->
    <button onclick="changeColor()">change background</button>
    <br /><br />
    <!-- qstn03 -->
    <input type="text" name="" id="inp" />
    <button onclick="getData()">get data</button>
    <h3></h3>
    <br /><br />

    <!-- qstn04 -->
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Nemo veritatis
      officiis, eum quae impedit necessitatibus earum! Minus distinctio fugit
      soluta maiores animi veritatis natus, doloribus modi ab, perspiciatis,
      commodi quod?
    </p>
    <button onclick="hide()">hide</button>
    <button onclick="show()">show</button>
    <br />
    <br />

    <!-- qstn05 -->
    <img style="height: 200px;"
      src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Gallet_clamshell_600x600_2.jpg"
      alt=""
    />
    <br>
    <button onclick="next()">next</button>
    <button onclick="back()">back</button>
  </body>
  <script>
    const changeText = () => {
      document.getElementsByTagName("h1")[0].innerText = "hello dom js";
    };
    const changeColor = () => {
      document.getElementsByTagName("body")[0].style.backgroundColor = "yellow";
    };
    const getData = () => {
      let value = document.getElementById("inp").value;
      document.getElementsByTagName("h3")[0].innerText = value;
    };

    const hide = () => {
      document.getElementsByTagName("p")[0].style.display = "none";
    };
    const show = () => {
      document.getElementsByTagName("p")[0].style.display = "block";
    };

    const next = () => {
      document.getElementsByTagName("img")[0].src =
        "https://www.licious.in/blog/wp-content/uploads/2022/04/shutterstock_1617156526-min-600x600.jpg";
    };
    const back = () => {
      document.getElementsByTagName("img")[0].src =
        "https://upload.wikimedia.org/wikipedia/commons/4/4f/Gallet_clamshell_600x600_2.jpg";
    };
  </script>
</html>
